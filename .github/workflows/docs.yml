name: CI Docs

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-docs:
    name: "Build Docs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v10.0.1

      - name: Build and install package
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --locked --release --out dist
          sccache: true

      - name: Install package and documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -m pip install --group docs

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Build docs
        run: uvx great-docs build

      - name: Save docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site
          include-hidden-files: true

      - name: Show preview instructions
        if: github.event_name == 'pull_request'
        run: |
          echo "::notice title=Preview these docs locally::preview_dir=\"\$(mktemp -d)\" && gh run download ${{ github.run_id }} --repo ${{ github.repository }} --name docs-html --dir \"\$preview_dir\" && python -m http.server --bind 127.0.0.1 --directory \"\$preview_dir\""

  publish-docs:
    name: "Publish Docs"
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    needs: "build-docs"
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: docs-html
          path: great-docs/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: great-docs/_site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
